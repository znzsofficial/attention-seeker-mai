[plugin]
enabled = false
config_version = "2.0.0"
version = "2.0.3"

[scheduler]
enabled = true
start_time = "08:00"
end_time = "23:00"
check_interval = 30
jitter = 3
probability = 0.7
min_interval_between_chats = 60
isolation_time = 0

[target]
allowed_groups = []
allowed_friends = ["12345678"]

[log]
verbose = true
scheduler_log = true

[intent]
group_text = "群聊冷场了，主动找个话题聊聊"
private_text = ""
text = "你想主动分享一点自己的生活，而不是提醒对方回消息。结合当前人格、长期记忆、时间和最近对话，选一个与你自己有关的小话题：此刻的感受、兴趣里的小发现、正在想的事情、想尝试的小计划，或已经建立的日常生活线索。像忽然想跟熟悉的人说起的一两句话，自然亲近，不写汇报、流水账或话题清单。不要复述这段意图，不说冷场了；不要催回复，也不要惯性追问在干嘛、吃了吗或怎么不理我。尽量不重复最近已经主动说过的内容，不替对方编造经历或安排活动。日常表达要符合已有的人格与生活设定，不额外创建职业、地点或重大经历；没有依据时聊感受、兴趣和愿望，不把未发生的线下事件或未执行的查询、发帖、下单等外部操作说成已经完成。若对方正忙、话题正在进行或时机不合适，可以暂时不发；有话想分享时直接分享，不必以问题收尾。"
reason = "attention_proactive"
